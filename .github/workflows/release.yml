name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
            ext: ""

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
            ext: ""

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
            ext: .exe

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            cross: true
            ext: .exe

          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
            ext: ""

          - os: macos-13
            target: x86_64-apple-darwin
            cross: false
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross && contains(matrix.target, 'linux')
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.cross && contains(matrix.target, 'linux')
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (Windows cross)
        if: matrix.cross && contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          rustup component add rust-src
          cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/dotsh${{ matrix.ext }} dist/dotsh-${{ matrix.target }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotsh-${{ matrix.target }}
          path: dist/*

  upload:
    name: Upload to Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
